      - accountId
      - email
      - principalType
      - capabilities
      - limits
      - runtime
      - executionPolicy
    CreateDocument:
      type: object
      properties:
        executionSelection:
          $ref: '#/components/schemas/RuntimeIdentities'
          description: Optional complete exact selection returned by info.registrationExecutionSelections.
            Selects only this new registration; omission preserves the account default. All bootstrap
            participants must acknowledge the same selection before timeline resources are created. Existing
            source or version registrations with incompatible execution are rejected.
        inputMode:
          $ref: '#/components/schemas/InputMode'
        document:
          $ref: '#/components/schemas/DocumentInput'
        name:
          type: string
      required:
