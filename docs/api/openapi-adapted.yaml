      operationId: listDocuments
      summary: List documents
      description: Optional typeBlueId selects the declared type and its transitive descendants using
        persisted metadata of the last stable document. Alternatively, typeBlueIds selects the union of
        up to 16 exact types and their descendants. The two selectors are mutually exclusive. Typed queries
        deduplicate registration aliases by native instance, include embedded managed documents, and use
        observation-bound continuation tokens. Unknown valid types add no matches. Missing metadata is
        reported in incompleteCount; it is never interpreted as a nonmatching type. Without either type
        selector, registration aliases remain visible and pagination is observation-bound. Other filters
        are combined with AND. Results are ordered by last activity descending, with unknown dates last
        and identity as a tie-breaker. The default limit remains 50. Warm type-only pages use a disposable
        ranked index; cold construction and additional filters may inspect the wider selection. Before
        first projection, an eligible confirmed new registration returns INITIAL with items empty, total
        zero, nextPageToken null and paginationMode OBSERVATION_BOUND; observationVersion is omitted.
        Valid type selectors add incompleteCount zero. All filters and tokens are still validated; malformed
        or foreign tokens return invalid_page_token and a valid unavailable observation returns page_token_expired.
        INITIAL represents the saved initial registration, not current journal emptiness or processing
        of accepted commands. Keep pending admissions and their Idempotency-Key unchanged.
      parameters:
      - name: typeBlueId
        in: query
        description: Exact immutable type BlueId; matches declared inheritance, not structural compatibility.
        schema:
          type: string
      - name: typeBlueIds
        in: query
        description: Comma-separated OR of 1 to 16 nonempty exact immutable type BlueIds, each including
          declared descendants. Mutually exclusive with typeBlueId. Order and duplicate IDs are normalized
          for pagination; the supplied list is bounded before deduplication. Unknown valid IDs add no
          matches. Keep the normalized set unchanged while following pageToken.
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageToken'
      - name: q
        in: query
        schema:
          type: string
        description: Case-insensitive literal substring of the display name, native last-stable description,
          sessionId or documentId. Matches any of these fields before type filtering and pagination. Does
          not search generated overview or other document content. Explicit sessionId and documentId selectors
          remain exact and combine with q using AND. Omit q or pass an empty value to list documents.
      - name: sessionId
        in: query
        description: Exact account-local session handle. Returns one accessible result or none, never
          fuzzy matches.
        schema:
          type: string
          minLength: 1
      - name: documentId
        in: query
        description: Exact native document identity. Returns all accessible matching instances; does not
          select an arbitrary instance or substitute for sessionId. Combined with other selectors using
          AND.
        schema:
          type: string
          minLength: 1
      - name: createdFrom
        in: query
        schema:
          type: string
          format: date
        description: Inclusive UTC creation date (YYYY-MM-DD), not last activity.
      - name: createdTo
        in: query
        schema:
          type: string
          format: date
        description: Inclusive UTC creation date (YYYY-MM-DD), not last activity.
      - name: includeUndated
        in: query
        schema:
          type: boolean
        description: Include records with unknown creation dates when a date filter is active. Without
          date filters undated records are already included.
      - name: status
        in: query
        schema:
          enum:
          - READY
          - PROCESSING
          - WAITING
          - PAUSED
          - ERROR
          - HOST_INCOMPLETE
        description: Current effective processing state, not lifecycle.
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/SessionContext'
      responses:
        '200':
          description: Document list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
              examples:
                executed-392:
                  $ref: '#/components/examples/Executed392'
                executed-394:
                  $ref: '#/components/examples/Executed394'
                executed-390:
                  $ref: '#/components/examples/Executed390'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DocumentPage'
              examples:
                executed-393:
                  $ref: '#/components/examples/Executed392'
                executed-395:
                  $ref: '#/components/examples/Executed394'
                executed-391:
                  $ref: '#/components/examples/Executed390'
          headers:
            Cache-Control:
              $ref: '#/components/headers/ReadCacheControl'
            X-MyOS-Read-State:
              $ref: '#/components/headers/ReadState'
            X-MyOS-Read-Source:
              $ref: '#/components/headers/ReadSource'
            X-MyOS-Projected-At:
              $ref: '#/components/headers/ProjectedAt'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
