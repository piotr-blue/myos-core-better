      required:
      - content
      additionalProperties: false
      description: Definition goal preserves required slots for later instances for source, exact and
        reference inputs.
    CreateTimeline:
      type: object
      properties:
        name:
          type: string
        actor:
          type: string
      description: Host allocates the timeline identity. public and custom timeline IDs are unsupported.
      additionalProperties: false
    AppendEntry:
      type: object
      properties:
        inputMode:
          $ref: '#/components/schemas/InputMode'
        documentId:
          type: string
          minLength: 1
          pattern: \S
        actor:
          type: string
          minLength: 1
          pattern: \S
        prevEntry:
          type:
          - string
          - 'null'
          description: Omitted means no predecessor assertion; null requires an empty timeline; string
            must equal its current head. Replay keeps the original committed entry.
        authority:
          type: string
          description: Native authority BlueId only; target mandateRef objects are unsupported.
        message:
          $ref: '#/components/schemas/SubmittedBlueValue'
      description: Direct Operation Request messages require documentId naming the original lineage. Ordinary
        messages need no artificial target. Exact/full references are not rebuilt from latest document
        state.
      additionalProperties: false
      required:
      - message
    ProposeMandateRequest:
      type: object
      additionalProperties: false
      required:
