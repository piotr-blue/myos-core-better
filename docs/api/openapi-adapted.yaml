          type: object
        actor:
          type: string
          minLength: 1
          pattern: \S
        authority:
          type: string
          description: Native authority BlueId only; target mandateRef objects are unsupported.
        mandateSessionId:
          type: string
          minLength: 1
          description: Agent-only selection of a native mandate held by this account and granted to this
