          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
        '404':
          $ref: '#/components/responses/Problem404'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ConsoleClient'
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/SessionContext'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A User-owned account-bound API key, an explicitly enrolled Cognito ID token, or a Core-owned
        opaque portal session. Ordinary requests authenticate an enrolled credential digest; an unknown
        JWT requires explicit token enrollment. API-key management requires a User session or enrolled
        JWT.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-myos_dev
      description: 'Core-owned opaque browser session. The cookie name is environment-specific (__Secure-myos_dev
        in DEV, __Secure-myos_prod in PROD). Mutations require X-MyOS-Client: console. Browser Origin
        must match the configured shared frontend. External clients use Bearer authentication.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Nonblank client key scoped to the selected User, account, membership generation, method
        and concrete native resource path. Retry the same path and payload. Native admission and webhook
        receipts are retained durably.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: \S
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageToken:
      name: pageToken
      in: query
      schema:
        type: string
      description: Opaque continuation returned as nextPageToken. Keep resource, filters, order and limit
        unchanged.
    ConsoleClient:
      name: X-MyOS-Client
      in: header
      required: false
      schema:
        type: string
        const: console
      description: Required when a mutation authenticates through the configured shared portal cookie.
        Bearer-authenticated requests do not require this header. The browser Origin must match the configured
        application origin.
    SelectedAccount:
      name: X-MyOS-Account
      in: header
      required: false
      description: Explicit per-tab Account selection for a human session. API keys are already Account-bound;
        an explicit value must match that binding. Omit only for User discovery and account creation/resolution/invitation
        acceptance.
      schema:
        type: string
    SessionContext:
      name: X-MyOS-Session-Context
      in: header
      required: false
      description: Expected context returned by GET /me for User-only commands, or GET /account for selected
        Account commands. Required for human session requests except discovery. API keys do not use this
        header. A different User or membership generation returns 409.
      schema:
        type: string
    AccountCommandId:
      name: Idempotency-Key
      in: header
      required: true
      description: Canonical lowercase UUID identifying one account-control intent. Reuse it with the
        same User, account, command and payload after an unknown response. A changed payload returns 409.
        Account creation scopes the intent to the User and does not select or activate a workspace.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  responses:
    Problem:
      description: Explicit validation, authentication, ownership, missing-resource, conflict, media,
        size or temporary-storage failure. No silent substitution for unsupported selectors.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:INVALID_INPUT
                title: INVALID_INPUT
                status: 400
                detail: Invalid request input
                code: INVALID_INPUT
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem400:
      description: Invalid request, selector, or transport input.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem400'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:INVALID_INPUT
                title: INVALID_INPUT
                status: 400
                detail: Invalid request input
                code: INVALID_INPUT
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem401:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem401'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:AUTHENTICATION_REQUIRED
                title: AUTHENTICATION_REQUIRED
                status: 401
                detail: Sign in or provide a Bearer API key
                code: AUTHENTICATION_REQUIRED
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer authentication challenge.
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem403:
      description: Origin, CSRF or ownership access denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem403'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:ORIGIN_REJECTED
                title: ORIGIN_REJECTED
                status: 403
                detail: Request origin does not match this application
                code: ORIGIN_REJECTED
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem404:
      description: Requested owned resource or retained evidence not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem404'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:DOCUMENT_NOT_FOUND
                title: DOCUMENT_NOT_FOUND
                status: 404
                detail: Document not found
                code: DOCUMENT_NOT_FOUND
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem406:
      description: Accept does not allow an available representation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem406'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:NOT_ACCEPTABLE
                title: NOT_ACCEPTABLE
                status: 406
                detail: Available representations are application/json and application/yaml
                code: NOT_ACCEPTABLE
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem409:
      description: Idempotency conflict, unavailable state, or failed precondition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem409'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:IDEMPOTENCY_CONFLICT
                title: IDEMPOTENCY_CONFLICT
                status: 409
                detail: Idempotency-Key was already used with different input
                code: IDEMPOTENCY_CONFLICT
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem413:
      description: Body exceeds 1 MiB or the supported transport nesting depth.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem413'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:BODY_LIMIT
                title: BODY_LIMIT
                status: 413
                detail: Request limit is 1 MiB
                code: BODY_LIMIT
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem415:
      description: Unsupported request Content-Type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem415'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:UNSUPPORTED_MEDIA_TYPE
                title: UNSUPPORTED_MEDIA_TYPE
                status: 415
                detail: Use application/json or application/yaml
                code: UNSUPPORTED_MEDIA_TYPE
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem422:
      description: Request does not satisfy a synchronous domain constraint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem422'
          examples:
            executed-245:
              $ref: '#/components/examples/Executed245'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem429:
      description: Account request rate or pending admission queue exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem429'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:RATE_LIMIT
                title: RATE_LIMIT
                status: 429
                detail: Too many requests; retry in a minute
                code: RATE_LIMIT
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
    Problem503:
      description: Temporarily busy, recovering, unavailable evidence/storage or service dependency.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem503'
          examples:
            failure:
              summary: Error response
              value:
                type: urn:myos:problem:UNAVAILABLE
                title: UNAVAILABLE
                status: 503
                detail: Service unavailable; retry with the same Idempotency-Key
                code: UNAVAILABLE
                instance: /api/blue/v1/documents
                requestId: example-request-id
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
  schemas:
    AdminSession:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - sessionContext
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        sessionContext:
          type: string
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - email
      - status
      - verified
      - enabled
      - createdAt
      - verifiedAt
      - verificationObservedAt
      properties:
        id:
          type: string
        userId:
          type:
          - string
          - 'null'
        email:
          type: string
        status:
          type: string
        verified:
          type: boolean
        enabled:
          type: boolean
        createdAt:
          type:
          - integer
          - 'null'
          format: int64
        verifiedAt:
          type:
          - integer
          - 'null'
          format: int64
        verificationObservedAt:
          type:
          - integer
          - 'null'
          format: int64
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
    AdminDirectorySync:
      type: object
      additionalProperties: false
      required:
      - baselineAt
      - lastCompletedAt
      - inProgress
      properties:
        baselineAt:
          type:
          - integer
          - 'null'
          format: int64
        lastCompletedAt:
          type:
          - integer
          - 'null'
          format: int64
        inProgress:
          type: boolean
    AdminUserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
        sync:
          $ref: '#/components/schemas/AdminDirectorySync'
    AdminWorkspace:
      type: object
      additionalProperties: false
      required:
      - accountId
      - kind
      - status
      - role
      - createdAt
      - profile
      properties:
        accountId:
          type: string
        kind:
          $ref: '#/components/schemas/AccountKind'
        status:
          type: string
        role:
          $ref: '#/components/schemas/MembershipRole'
        createdAt:
          type:
          - integer
          - 'null'
          format: int64
        membershipStatus:
          type: string
        profile:
          $ref: '#/components/schemas/AccountProfile'
    AdminUserDetail:
      type: object
      additionalProperties: false
      required:
      - user
      - workspaces
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/AdminWorkspace'
    AdminNotifications:
      type: object
      additionalProperties: false
      required:
      - recipients
      - revision
      properties:
        recipients:
          type: array
          items:
            type: string
            format: email
          maxItems: 100
        revision:
          type: integer
          format: int64
    UpdateAdminNotifications:
      type: object
      additionalProperties: false
      required:
      - recipients
      - expectedRevision
      properties:
        recipients:
          type: array
          items:
            type: string
            format: email
          maxItems: 100
        expectedRevision:
          type: integer
          format: int64
    ImpersonationMetadata:
      type: object
      additionalProperties: false
      required:
      - actorUserId
      - actorEmail
      - userId
      - email
      - createdAt
      - expiresAt
      - sessionContext
      properties:
        actorUserId:
          type: string
        actorEmail:
          type: string
        userId:
          type: string
        email:
          type: string
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        sessionContext:
          type: string
    ImpersonationSession:
      type: object
      additionalProperties: false
      required:
      - token
      - userId
      - email
      - expiresAt
      - impersonation
      properties:
        token:
          type: string
        userId:
          type: string
        email:
          type: string
        expiresAt:
          type: integer
          format: int64
        impersonation:
          $ref: '#/components/schemas/ImpersonationMetadata'
    EndImpersonationResult:
      type: object
      additionalProperties: false
      required:
      - ended
      properties:
        ended:
          type: boolean
          const: true
    AgentEventArguments:
      type: object
      additionalProperties: false
      description: Select exact instances, or account scope to include future readable documents. These
        selections are mutually exclusive.
      if:
        required:
        - scope
      then:
        not:
          required:
          - instanceIds
      else:
        required:
        - instanceIds
      properties:
        scope:
          type: string
          enum:
          - account
        instanceIds:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 200
    AgentEventDelivery:
      type: object
      additionalProperties: false
      required:
      - mode
      - url
      properties:
        mode:
          type: string
          enum:
          - webhook
        url:
          type: string
          format: uri
          maxLength: 2048
    AgentEventSubscribeDelivery:
      type: object
      additionalProperties: false
      required:
      - mode
      - url
      - secret
      properties:
        mode:
          type: string
          enum:
          - webhook
        url:
          type: string
          format: uri
          maxLength: 2048
        secret:
          type: string
          writeOnly: true
          minLength: 38
          maxLength: 94
          description: Provider-issued Standard Webhooks secret. Never place it in a tool or document.
    UnsubscribeAgentEvents:
      type: object
      additionalProperties: false
      required:
      - name
      - arguments
      - delivery
      properties:
        name:
          type: string
          enum:
          - document.updated
        arguments:
          $ref: '#/components/schemas/AgentEventArguments'
        delivery:
          $ref: '#/components/schemas/AgentEventDelivery'
    SubscribeAgentEvents:
      type: object
      additionalProperties: false
      required:
      - name
      - arguments
      - delivery
      properties:
        name:
          type: string
          enum:
          - document.updated
        arguments:
          $ref: '#/components/schemas/AgentEventArguments'
        delivery:
          $ref: '#/components/schemas/AgentEventSubscribeDelivery'
        cursor:
          type:
          - string
          - 'null'
          maxLength: 16384
        ttlMs:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9007199254740991
          description: Requested lifetime in milliseconds; the server grants at most 24 hours.
    AgentEventSubscription:
      type: object
      additionalProperties: false
      required:
      - id
      - refreshBefore
      - cursor
      - truncated
      properties:
        id:
          type: string
        refreshBefore:
          type: string
          format: date-time
        cursor:
          type:
          - string
          - 'null'
        truncated:
          type: boolean
    AgentEventUnsubscribed:
      type: object
      additionalProperties: false
    DeleteAccountImage:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
      required:
      - expectedRevision
    PutAccountImage:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: JPEG or PNG, at most 5 MiB and 16 million decoded pixels. Orientation is normalized
            and metadata stripped; stored size is at most 512 by 512 pixels.
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
      required:
      - file
      - expectedRevision
    AccountProfileInput:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          maxLength: 1000
          description: Optional business address. Omit on update to preserve it; an empty string clears
            it. Unavailable for personal accounts.
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        website:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          description: Account website. HTTP(S) only; never fetched by this API. Null clears it on update;
            omission preserves it.
      required:
      - displayName
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required:
      - invitationId
      - accountId
      - userId
      - membershipGeneration
      - membershipRevision
      - role
      - receiptId
      properties:
        invitationId:
          type: string
        accountId:
          type: string
        userId:
          type: string
        membershipGeneration:
          type: integer
          format: int64
        membershipRevision:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/InvitationRole'
        receiptId:
          type: string
    AccountAgentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountAgent'
      required:
      - items
    CreateAccountAgent:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum:
          - READ_SELECTED
          - READ_ALL
          default: READ_SELECTED
      required:
      - name
    UpdateAccountAgent:
      type: object
      additionalProperties: false
      properties:
        inclusion:
          type: boolean
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum:
          - READ_SELECTED
          - READ_ALL
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
      required:
      - expectedRevision
    AccountAgent:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
        agentId:
          type: string
        kind:
          type: string
          enum:
          - BUILT_IN
          - EXTERNAL
        role:
          type: string
          enum:
          - READ_ALL
          - READ_SELECTED
        inclusion:
          type: boolean
        execution:
          type: string
          enum:
          - DISABLED
          - ENABLED
          - EXTERNAL
        actorStatus:
          type: string
          enum:
          - UNQUALIFIED
          - QUALIFIED
        revision:
          type: integer
          format: int64
        executionProfiles:
          type: array
          items:
            type: string
          description: Explicitly configured and qualified native execution profiles. This capability
            declaration is not a worker liveness assertion.
        authoring:
          $ref: '#/components/schemas/AgentAuthoringProfile'
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
      required:
      - accountId
      - agentId
      - kind
      - role
      - inclusion
      - execution
      - actorStatus
      - revision
    AgentConnection:
      type: object
      additionalProperties: false
      properties:
        connectionId:
          type: string
        agentId:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        scopes:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
        approvedAt:
          type: integer
          format: int64
        revokedAt:
          type: integer
          format: int64
      required:
      - connectionId
      - agentId
      - clientId
      - status
      - scopes
      - revision
    AgentConnectionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentConnection'
      required:
      - items
    RevokeAgentConnection:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
      required:
      - expectedRevision
    RevokeInvitation:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
      required:
      - expectedRevision
    AcceptInvitation:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
      required:
      - token
      - expectedRevision
    AccountInvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountInvitation'
      required:
      - items
    AccountInvitation:
      type: object
      additionalProperties: false
      properties:
        invitationId:
          type: string
        accountId:
          type: string
        recipientEmail:
          type: string
          format: email
        recipientUserId:
          type:
          - string
          - 'null'
          description: The specific User bound to the invitation, or null when acceptance is bound only
            to the verified recipient email.
        role:
          $ref: '#/components/schemas/InvitationRole'
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REVOKED
        revision:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        acceptedAt:
          type:
          - integer
          - 'null'
          format: int64
        acceptedBy:
          type:
          - string
          - 'null'
      required:
      - invitationId
      - accountId
      - recipientEmail
      - role
      - status
      - revision
      - expiresAt
      - createdAt
    CreateInvitation:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/InvitationRole'
        targetUserId:
          type: string
      required:
      - email
      - role
    MembershipReceipt:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
        userId:
          type: string
        generation:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: integer
          format: int64
