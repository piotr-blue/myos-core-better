      additionalProperties: false
      description: Registers one document. document accepts a Blue object or serialized JSON/YAML document
        text. inputMode defaults to source; exact preserves the supplied value. One document per request;
        bulk submissions are unsupported.
    CreateContent:
      type: object
      properties:
        inputMode:
          $ref: '#/components/schemas/InputMode'
