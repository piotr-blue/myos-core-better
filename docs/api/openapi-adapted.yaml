      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            examples:
              executed-7:
                $ref: '#/components/examples/Executed7'
          application/yaml:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            examples:
              executed-8:
                $ref: '#/components/examples/Executed7'
      callbacks:
        nativeEvent:
          '{$request.body#/url}':
            post:
              summary: Deliver one retained native-v1 event
              description: 'The receiver verifies HMAC-SHA256 using UTF-8 signingSecret over UTF8(timestamp
                + ".") followed by raw HTTP body bytes. Timestamp is an ISO-8601 Instant, not Unix seconds.
                Any 2xx succeeds. Network failure/no status, 408, 429 and 5xx retry; other 4xx and 3xx
                fail and redirects are not followed. Eight attempts per ordinary cycle is not a lifetime
                transmission bound: crash recovery and manual retries can add attempts. Recovery may leave
                UNKNOWN outcomes; DELETE cannot recall an in-flight request. Raw bytes for every attempt
                are not separately persisted.'
              parameters:
              - in: header
                name: x-myos-signature
                required: true
                schema:
                  type: string
                  pattern: ^t=.+,v1=[0-9a-f]{64}$
                description: t=<ISO-8601 Instant>,v1=<lowercase hexadecimal HMAC-SHA256>. Verify against
                  the received raw body bytes.
                example: t=2026-10-12T14:51:06.600888Z,v1=b6a24354addb8c17d89f5603b9c58bb4e8bb2df499dd9cc87a34e46081d8d7db
              - in: header
                name: x-myos-event-id
                required: true
                schema:
                  type: string
                description: Stable retained event ID.
                example: evt_b4bb07ae19be66ee9c2b91885f37f79b01fd2f236b61316143bf1d3868bc96e9
              - in: header
                name: x-myos-webhook-event-delivery-id
                required: true
                schema:
                  type: string
                description: Stable deliveryId for this webhook/event pair.
                example: del_feedae3f343e6f2a25c4ed840cf5129634db6161fef6b18eec640ee0f387b963
              - in: header
                name: x-myos-webhook-delivery-id
                required: true
                schema:
                  type: string
                description: Changing attemptId. Despite its historical header name, this is the individual
                  transmission identity.
                example: 92e882b7-4ced-4d19-851a-9b2218236a41
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Event'
                    examples:
                      executed-181:
                        $ref: '#/components/examples/Executed181'
              responses:
                2XX:
                  description: Acknowledged; delivery succeeds. Receiver business completion is outside
                    this protocol.
                3XX:
                  description: Permanent delivery failure; redirects are not followed.
                '408':
                  description: Transient timeout; retry within ordinary cycle budget.
                '429':
                  description: Transient throttling; retry within ordinary cycle budget.
                4XX:
                  description: Permanent failure except 408 and 429.
                5XX:
                  description: Transient receiver failure; retry within ordinary cycle budget.
                default:
                  description: No usable response/network failure may be retried.
      description: Creates a subscription for future events. The signing secret is returned on creation
        and valid replay; store it securely to verify callbacks.
