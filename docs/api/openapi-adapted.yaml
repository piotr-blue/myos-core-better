          type: object
          description: The selected edition's policy. The current edition defaults to and permits 10000000
            gas units. Historical captures retain their original policies.
          properties:
            gasLimit:
              type: integer
            standardGasLimit:
              type: integer
            temporaryHostOverride:
              type: boolean
          required:
          - gasLimit
          - standardGasLimit
          - temporaryHostOverride
      required:
