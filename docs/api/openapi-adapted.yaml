        name:
          type: string
        url:
          type: string
          format: uri
        status:
          enum:
          - ACTIVE
          - INACTIVE
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSelector'
        filters:
          $ref: '#/components/schemas/WebhookFilters'
        callbackProtocol:
          const: native-v1
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        signingSecret:
          type: string
          description: Shown only for creation and valid creation replay; never returned by configuration
            reads.
      required:
      - id
      - url
      - status
      - events
      - filters
      - callbackProtocol
      - signingSecret
      additionalProperties: false
    InputMode:
      type: string
      enum:
      - source
      - exact
      default: source
      description: Omission equals source, including idempotency. source resolves names and prepares the
        supplied value; exact preserves it. Null is invalid. A complete singleton blueId reference resolves
        an existing exact value in either mode.
    SubmittedBlueValue:
      not:
        type: 'null'
      description: Complete Blue value. A singleton blueId object references an accessible existing exact
        value; objects with blueId and other fields follow native Blue validation without whole-value
        lookup. Nested references remain inside the value. Scalar strings are literal text. Fields named
        mode, format and text are ordinary domain fields here.
      allOf:
      - if:
          type: object
          required:
          - blueId
          maxProperties: 1
        then:
          $ref: '#/components/schemas/BlueReference'
    DocumentInput:
      type:
      - object
      - string
      description: One Blue document object or serialized JSON/YAML document text. A singleton blueId
        object resolves an existing exact document. A serialized document must parse to an object. One
        document per request; bulk submissions are unsupported.
      allOf:
      - if:
          type: object
          required:
          - blueId
          maxProperties: 1
        then:
          $ref: '#/components/schemas/BlueReference'
      not:
        type: object
        required:
        - documents
        properties:
          documents:
            type: object
          edges: {}
          publicRoots: {}
          definitions: {}
        additionalProperties: false
    StableEpoch:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          description: Stable publication number within the document lineage; zero identifies the initial
            stable publication.
          minimum: 0
        documentId:
          type: string
          description: Identity of the document lineage, shared by its versions; distinct from the registration
            handle and exact content BlueId.
        documentRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact Blue reference to the document value at the selected publication.
        positionRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact History Position for this publication; distinct from the document value and
            epoch number.
        receiptRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact Processing Receipt for the completed computation represented by this publication.
        emitted:
          type: array
          description: Exact references to values emitted by this publication; an empty list means it
            emitted none.
          items:
            $ref: '#/components/schemas/BlueReference'
        gas:
          anyOf:
          - type: object
            properties:
              used:
                type: integer
                minimum: 0
              limit:
                type: integer
                minimum: 0
                description: Original shared execution budget, when retained and correlated to this receipt.
                  Never taken from current account configuration.
            required:
            - used
            additionalProperties: false
          - type: 'null'
          description: Gas retained for the selected publication transition; COMPLETE may reuse an earlier
            receipt with zero incremental gas. Not cumulative billing.
        document:
          type: object
          description: Exact document value pinned to documentRef, included on epoch detail. Cyclic values
            retain references without an owning-set proof wrapper.
        cause:
          anyOf:
          - $ref: '#/components/schemas/EpochCause'
          - type: 'null'
        cumulativeGas:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Sum of known receipt gas in this document history through the selected epoch, counting
            each receipt once, including non-stable transitions. Null if a required measurement is unavailable;
            not an account debit.
        evidenceTarget:
          $ref: '#/components/schemas/EvidenceTarget'
      required:
      - documentId
      - documentRef
      - emitted
      - epoch
      - gas
      - positionRef
      - receiptRef
      - cause
      - cumulativeGas
      - evidenceTarget
      description: 'Selected stable publication with retained cause, measured gas and an exact evidence
        target. No previousEpochRef is invented: Core does not retain a separate epoch-content object.
        Native per-transition gas remains incremental; COMPLETE may reuse an earlier receipt with zero
        additional gas.'
    StableEpochPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StableEpoch'
        nextPageToken:
          type:
          - string
          - 'null'
        paginationMode:
          type: string
        total:
          type: integer
        hasMore:
          type: boolean
      required:
      - items
      - nextPageToken
      description: Bounded retained history pinned on first page.
    ProviderRangeProof:
      type: object
      properties:
        timelineRef:
          $ref: '#/components/schemas/BlueReference'
        beforeUs:
          type: integer
          minimum: 0
          maximum: 9007199254740992
        afterEntryRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlueReference'
        guaranteeRef:
          $ref: '#/components/schemas/BlueReference'
        attestationRef:
          $ref: '#/components/schemas/BlueReference'
        guarantee:
          $ref: '#/components/schemas/NativeExactContent'
        attestation:
          $ref: '#/components/schemas/NativeExactContent'
        nextPageToken:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        paginationMode:
          const: BOUNDED_PROVIDER_RANGE
      required:
      - timelineRef
      - beforeUs
      - afterEntryRef
      - items
      - guaranteeRef
      - attestationRef
      - guarantee
      - attestation
      - nextPageToken
      - hasMore
      - paginationMode
      description: Existing signed provider range; upper completeness boundary is pinned by continuation.
        Requests beyond the established provider frontier fail without advancing it.
    AdmissionKind:
      type: string
      enum:
      - DOCUMENT_BOOTSTRAP
      - DOCUMENT
      - OPERATION
      - TIMELINE_ENTRY
      - TIMELINE
      - CONTENT
      - CONTENT_REMOVE
      - PAUSE
      - RESUME
      - RETRY
      - REMOVE
      - PACKAGE_INSTALL
      - PACKAGE_REMOVE
    NativeHistoryEventPayload:
      type: object
      properties:
        number:
          type: integer
        epoch:
          type: integer
        kind:
          enum:
          - INITIALIZE
          - PROCESS
          - APPLY
          - COMPLETE
        stable:
          type: boolean
        document:
          type:
          - string
          - 'null'
        position:
          type:
          - string
          - 'null'
        receipt:
          type:
          - string
          - 'null'
        effectiveOrder:
          type:
          - array
          - 'null'
          items: {}
        gas:
          type:
          - integer
          - 'null'
        timings:
          type: object
      required:
      - number
      - epoch
      - kind
      - stable
      - document
      - position
      - receipt
      - gas
      description: The history transition as recorded when the event was published. Its fields differ
        from the HistoryPosition resource.
    AdmissionStatusEventPayload:
      type: object
      properties:
        status:
          enum:
          - pending
          - succeeded
          - failed
        action:
          type: string
        result:
          type:
          - object
          - 'null'
          description: Result recorded when the event was published. Its fields differ from Admission.details
            and may include id and location.
        problem:
          type:
          - object
          - 'null'
      required:
      - status
      - action
      - result
      - problem
      description: Admission status, action, result and problem at publication time. Event status values
        are lowercase; Admission resource statuses are uppercase.
    EpochAdvancedEventPayload:
      type: object
      properties:
        blueId:
          type: string
        epoch:
          type: integer
        historyNumber:
          type: integer
        emitted:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              event:
                $ref: '#/components/schemas/BlueReference'
            required:
            - id
            - event
            additionalProperties: false
        gas:
          type:
          - integer
          - 'null'
      required:
      - blueId
      - epoch
      - historyNumber
      - emitted
      - gas
      additionalProperties: false
    ProcessingErrorEventPayload:
      type: object
      properties:
        status:
          enum:
          - ERROR
          - HOST_INCOMPLETE
        issue:
          type:
          - object
          - 'null'
      required:
      - status
      - issue
      additionalProperties: false
    NamedResourceEventPayload:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
      required:
      - name
      additionalProperties: false
    BlueIdentityEventPayload:
      type: object
      properties:
        blueId:
          type: string
      required:
      - blueId
      additionalProperties: false
    ControlEventPayload:
      type: object
      properties:
        admissionId:
          type: string
      required:
      - admissionId
      additionalProperties: false
    EventCommon:
      type: object
      properties:
        id:
          type: string
        sequence:
          type: integer
        created:
          type: string
          format: date-time
        accountId:
          type: string
      required:
      - id
      - sequence
      - created
      - accountId
      description: Immutable retained native-v1 event envelope; sequence is account-local.
    AdmissionStatusEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: ADMISSION_STATUS_CHANGED
          ref:
            type: object
            properties:
              admissionId:
                type: string
            required:
            - admissionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/AdmissionStatusEventPayload'
        required:
        - type
        - ref
        - object
      description: New native admission or changed native status. ref.admissionId is the host receipt
        identity.
    DocumentCreatedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_CREATED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            oneOf:
            - $ref: '#/components/schemas/NamedResourceEventPayload'
            - $ref: '#/components/schemas/BlueIdentityEventPayload'
        required:
        - type
        - ref
        - object
      description: 'Two native variants: host registration publishes {name} with registration sessionId;
        first stable managed document publishes {blueId} with native instance identity in ref.sessionId.'
    DocumentRemovedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_REMOVED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/ControlEventPayload'
        required:
        - type
        - ref
        - object
      description: Successful document delete/unlink. ref.sessionId is the requested registration/control
        handle, not proof that shared execution terminated.
    DocumentPausedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_PROCESSING_PAUSED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/ControlEventPayload'
        required:
        - type
        - ref
        - object
      description: Successful native pause command; ref.sessionId is its requested handle.
    DocumentResumedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_PROCESSING_RESUMED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/ControlEventPayload'
        required:
        - type
        - ref
        - object
      description: Successful native resume command; ref.sessionId is its requested handle.
    DocumentHistoryEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_PROCESSING_HISTORY_APPENDED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/NativeHistoryEventPayload'
        required:
        - type
        - ref
        - object
      description: Native history publication; ref.sessionId is native instance identity, including unstable
        APPLY and COMPLETE.
    DocumentEpochEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_EPOCH_ADVANCED
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/EpochAdvancedEventPayload'
        required:
        - type
        - ref
        - object
      description: New stable native epoch with emitted references and native gas; ref.sessionId is native
        instance identity.
    DocumentErrorEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: DOCUMENT_PROCESSING_ERROR
          ref:
            type: object
            properties:
              sessionId:
                type: string
            required:
            - sessionId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/ProcessingErrorEventPayload'
        required:
        - type
        - ref
        - object
      description: Entering ERROR/HOST_INCOMPLETE or changed issue in that state; ref.sessionId is native
        instance identity.
    TimelineCreatedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: TIMELINE_CREATED
          ref:
            type: object
            properties:
              timelineId:
                type: string
            required:
            - timelineId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/NamedResourceEventPayload'
        required:
        - type
        - ref
        - object
      description: Owned host timeline metadata created. ref.timelineId is the host timeline identity.
    TimelineEntryCreatedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: TIMELINE_ENTRY_CREATED
          ref:
            type: object
            properties:
              timelineId:
                type: string
            required:
            - timelineId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/BlueIdentityEventPayload'
        required:
        - type
        - ref
        - object
      description: New provider entry. ref.timelineId is the native timeline BlueId, unlike TIMELINE_CREATED.
    ContentCreatedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: CONTENT_CREATED
          ref:
            type: object
            properties:
              blueId:
                type: string
            required:
            - blueId
            additionalProperties: false
          object:
            $ref: '#/components/schemas/NamedResourceEventPayload'
        required:
        - type
        - ref
        - object
      description: New explicit content retention metadata; not every internal content publication.
    LastStable:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          description: Stable publication number within the document lineage; zero identifies the initial
            stable publication.
          minimum: 0
        documentRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact Blue reference to the document value at the selected publication.
        positionRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact History Position for this publication; distinct from the document value and
            epoch number.
        receiptRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact Processing Receipt for the completed computation represented by this publication.
      required:
      - documentRef
      - epoch
      - positionRef
      - receiptRef
    NativeProcessing:
      type: object
      properties:
        state:
          enum:
          - READY
          - PROCESSING
          - WAITING
          - PAUSED
          - ERROR
          - HOST_INCOMPLETE
        nativeState:
          enum:
          - READY
          - PROCESSING
          - WAITING
          - ERROR
          - HOST_INCOMPLETE
        checkedBoundary:
          type: integer
        reason:
          anyOf:
          - $ref: '#/components/schemas/NativeProcessingReason'
          - type: 'null'
        issue:
          anyOf:
          - $ref: '#/components/schemas/NativeProcessingReason'
          - type: 'null'
        retryable:
          type: boolean
        paused:
          type: boolean
      required:
      - state
      - nativeState
      - checkedBoundary
      - reason
      - issue
      - retryable
      - paused
      description: Original Core processing observation, with the direct pause flag, native/effective
        state and current reason or issue. A missing blocker does not prove completion.
    DeliveryDetail:
      type: object
      properties:
        delivery:
          $ref: '#/components/schemas/Delivery'
        event:
          $ref: '#/components/schemas/Event'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
      required:
      - delivery
      - event
      - attempts
      additionalProperties: false
      description: Delivery selected by webhookId/eventId, its retained native event, and retained attempts.
        Internal scheduling and lease fields are excluded.
    ManagedRelationship:
      type: object
      additionalProperties: false
      properties:
        direction:
          type: string
          description: Direction relative to the requested session.
          enum:
          - incoming
          - outgoing
        occurrenceId:
          type: string
          description: Stable retained identity of this managed occurrence, not a guessed channel label.
        generation:
          type: integer
          description: Actual occurrence generation distinguishing reattachment or replacement at the
            same path.
          minimum: 0
        path:
          type: string
          description: Document pointer identifying the managed occurrence in the receiving target document.
        state:
          type: string
          enum:
          - HISTORY_PENDING
          - UNRESOLVED
          description: HISTORY_PENDING means a retained unfinished catch-up goal identifies the required
            position. UNRESOLVED means no required position is established from retained goal evidence;
            a healthy occurrence can also be unresolved after its goal is removed. Core does not advertise
            LIVE without occurrence-bound applied-position proof.
        source:
          $ref: '#/components/schemas/RelationshipEndpoint'
          description: Source endpoint of this retained managed dependency relationship. Its document
            identity does not grant access to a source registration.
        target:
          $ref: '#/components/schemas/RelationshipEndpoint'
          description: Target endpoint of this retained managed dependency relationship. An unavailable
            endpoint reference is not synthesized from the current document.
        requiredPositionRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Exact source History Position required by the receiving obligation when established.
            Null means the required position is unresolved, not unnecessary.
      required:
      - direction
      - generation
      - occurrenceId
      - path
      - requiredPositionRef
      - source
      - state
      - target
      allOf:
      - if:
          properties:
            state:
              const: UNRESOLVED
          required:
          - state
        then:
          properties:
            requiredPositionRef:
              type: 'null'
      - if:
          properties:
            state:
              const: HISTORY_PENDING
          required:
          - state
        then:
          properties:
            requiredPositionRef:
              $ref: '#/components/schemas/BlueReference'
    RelationshipEndpoint:
      type: object
      additionalProperties: false
      properties:
        documentRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact source/target document identity retained with this occurrence.
        sessionId:
          type:
          - string
          - 'null'
          description: Accessible hosted session handle when known; null does not manufacture a registration
            for the referenced document.
      required:
      - documentRef
      - sessionId
    RelationshipPage:
      type: object
      additionalProperties: false
      properties:
        positionRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Selected receiver History Position for outgoing traversals. Null for incoming or
            both, which do not have one receiver position, and also possible before an outgoing position
            has been established.
        observationVersion:
          type: string
          description: Opaque revision of the selected relationship view/traversal. For LIVE incoming
            or both reads, each page declares the revision of that page without promising one snapshot
            across pages.
        items:
          type: array
          description: Retained managed occurrences in stable occurrence identity/generation order.
          items:
            $ref: '#/components/schemas/ManagedRelationship'
        nextPageToken:
          type:
          - string
          - 'null'
          description: Opaque continuation over the same authorized relationship traversal; null ends
            that traversal.
      required:
      - items
      - nextPageToken
      - observationVersion
      - positionRef
      description: Current retained relationship view. Only outgoing traversal is pinned to its observed
        revision, and continuation fails if the graph changes. Incoming and both traverse LIVE pages with
        a revision per page. Historical positionBlueId selection is unsupported.
    ContentValue:
      description: A complete Blue value, without a transport wrapper. Objects, arrays and scalar values
        retain their data and numeric precision. Cyclic members contain references rather than an expanded
        graph. Fields named mode, text, proof and body are ordinary data.
      not:
        type: 'null'
    ExactContentSubmission:
      type: object
      additionalProperties: false
      properties:
        content:
          $ref: '#/components/schemas/ContentValue'
      required:
      - content
      description: Exact Blue content to retain under the BlueId in the path. The content is not source-preprocessed
        and a singleton blueId object is not a lookup shorthand.
    AgentRunArtifactFile:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
          enum:
          - document.blue
          - result.json
          - evidence.zip
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
      required:
      - fileName
      - sha256
      - sizeBytes
    DocumentAgentRun:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
        profile:
          type: string
        nativeDisposition:
          type: string
        executionStatus:
          type: string
          enum:
          - RUNNING
          - AWAITING_NATIVE_REPORT
          - CLOSED
          description: Worker observation only; provider completion never determines the native Task result.
        artifactStatus:
          type: string
          enum:
          - NOT_APPLICABLE
          - PENDING
          - READY
          - INVALID
          - UNAVAILABLE
          description: Output custody status, separate from the accepted native report.
        artifactsReady:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/AgentRunArtifactFile'
      required:
      - requestId
      - profile
      - nativeDisposition
      - executionStatus
      - artifactStatus
      - artifactsReady
      - files
    DocumentAgentRunPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentAgentRun'
      required:
      - items
    AgentAuthoringProfile:
      type: object
      additionalProperties: false
      required:
      - profile
      - bundleSha256
      properties:
        profile:
          type: string
          enum:
          - myos-document-author-v1
        bundleSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 of the trusted document authoring kit configured for this execution profile.
    MandateSharingSettings:
      type: object
      additionalProperties: false
      required:
      - enabled
      - revision
      properties:
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
    PartyAccessAutomationSettings:
      type: object
      required:
      - automaticallyUpdatePartyAccess
      additionalProperties: false
      properties:
        automaticallyUpdatePartyAccess:
          type: boolean
          description: Execute approved, bootstrap-scoped owner access updates automatically. Defaults
            to true.
    PartyAccessRequest:
      type: object
      required:
      - id
      - sessionId
      - party
      - admissionRef
      - request
      - status
      properties:
        id:
          type: string
        sessionId:
          type: string
        party:
          type: string
        admissionRef:
          type: string
        status:
          type: string
        request:
          type: object
          additionalProperties: true
        problem:
          type: object
          additionalProperties: true
    PartyAccessRequests:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartyAccessRequest'
  examples:
    BootstrapRecipientsExample:
      summary: Retained participant and reader roles
      value:
        admissionId: bootstrap-example
        recipients:
        - accountId: alice
          roles:
          - kind: PARTICIPANT
            name: owner
          sessionId: session-example
