        until background registration and authorization preparation complete. PENDING is a successful
        save; the account is not yet selectable. Repeat the identical request with the same Idempotency-Key
        to read its current receipt, which becomes READY when the account is selectable. Repeating the
        request does not perform registration or activate a workspace. Changed input with the same key
        is rejected. Native workspace execution remains lazy and is not activated by this command.
