  /api/blue/v1/accounts/lookup:
    post:
      tags:
      - Account
      operationId: lookupAccounts
      summary: Find accounts by IDs, member emails and text
      description: 'Finds ACTIVE accounts in the authenticated namespace, including accounts the caller
        has not joined. No selected account is required. Selectors combine with AND; values within accountIds
        or emails combine with OR. q matches a literal case-insensitive email prefix or account-name substring.
        With emails and q, the same User must satisfy both email conditions unless the account name matches
        q. Every ACTIVE membership role contributes matches. matchedUsers contains only matching Users,
        never the complete membership roster, and is empty for an IDs-only or name-only match. Results
        are ordered by accountId. Each page reads one SQL snapshot; later pages observe current data.
        Tokens bind caller/session, namespace, normalized selectors and effective limit. IDs absent from
        the result were not matched; batch clients must collect every page before checking completeness.
        This read never creates accounts, sends invitations, activates a workspace or grants document
        access. Responses use Cache-Control: no-store.'
