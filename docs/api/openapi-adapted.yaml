  /api/blue/v1/agent-subscriptions:
    post:
      tags:
      - Agent Events
      operationId: subscribeAgentEvents
      summary: Subscribe to Agent document events
      description: External connection only; requires documents:read and events:subscribe. Identity is
        derived from the credential. The exact connection, callback, name and canonical instance list
        identify the subscription; no Idempotency-Key is used. Callback verification and activation are
        generation fenced. No access-token lifetime is retained by the dispatcher.
      parameters:
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/ConsoleClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeAgentEvents'
            examples:
              executed-525:
                $ref: '#/components/examples/Executed525'
      responses:
        '200':
          description: Current subscription result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEventSubscription'
              examples:
                executed-524:
                  $ref: '#/components/examples/Executed524'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
    delete:
      tags:
      - Agent Events
      operationId: unsubscribeAgentEvents
      summary: Unsubscribe from Agent document events
      description: External connection only; requires documents:read and events:subscribe. Identity is
        derived from the credential. The exact connection, callback, name and canonical instance list
        identify the subscription; no Idempotency-Key is used. Callback verification and activation are
        generation fenced. No access-token lifetime is retained by the dispatcher.
      parameters:
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/ConsoleClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeAgentEvents'
            examples:
              executed-527:
                $ref: '#/components/examples/Executed527'
      responses:
        '200':
          description: Current subscription result.
          headers:
