      - scope
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 8000
        scope:
          type: object
          minProperties: 1
          maxProperties: 32
          additionalProperties: true
          description: Native Operation Mandate scope entries proposed by the Agent for human review.
    OperationReviewedPublication:
      type: object
      required:
      - documentRef
      - epoch
      properties:
        documentRef:
          $ref: '#/components/schemas/BlueReference'
        epoch:
          type:
          - integer
          - string
          minimum: 0
          pattern: ^[0-9]+$
          description: Exact retained publication epoch. Use decimal text beyond client numeric precision.
      additionalProperties: false
    OperationPreparationRoute:
      type: object
      required:
      - channel
      - timeline
      - actor
      properties:
        channel:
          type: string
          minLength: 1
        timeline:
          type: string
          minLength: 1
        actor:
          type: string
          minLength: 1
      additionalProperties: false
      description: One exact caller-authorized discovery route selected for review.
    OperationContext:
      type: object
      required:
      - accountId
      - sessionId
      - documentId
      - reviewedPublication
      - path
      properties:
        accountId:
          type: string
        sessionId:
          type: string
        documentId:
          type:
          - string
          - 'null'
        reviewedPublication:
          $ref: '#/components/schemas/OperationReviewedPublication'
        path:
          type: string
        valueJson:
          type: string
          description: Exact native literal projection. Formal contracts are references; other state and
            existing references are preserved. Maximum 262144 UTF-8 bytes; larger values return 413 and
            can be explored with childrenOffset.
        children:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - path
            properties:
              path:
                type: string
            additionalProperties: false
        nextChildrenOffset:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
      description: Publication-bound operation context. Ordinary reads return valueJson; childrenOffset
        reads return children and nextChildrenOffset instead, without child values or dereferencing them.
    PrepareDocumentOperation:
      type: object
      required:
      - operationName
      - reviewedPublication
      - route
      properties:
        operationName:
          type: string
          minLength: 1
          description: Exact discovery dispatch key, not a display name.
        reviewedPublication:
          $ref: '#/components/schemas/OperationReviewedPublication'
        route:
          $ref: '#/components/schemas/OperationPreparationRoute'
        requestJson:
          type: string
          description: User-supplied native request encoded as JSON text, including scalar, list, object
            or null. Omission requests the input description; it is distinct from explicit null or an
            empty object. Numeric values are preserved without conversion to client floating point.
        definitionView:
          $ref: '#/components/schemas/OperationDefinitionView'
        descriptorPath:
          type: string
          description: Canonical operation-definition selector from a returned descriptor. Empty selects
            the root; only fields, items, item, key and value slots are accepted. Does not change validation
            or digest.
        descriptorOffset:
          type: integer
          minimum: 0
          description: Continuation offset from nextFieldsOffset or nextItemsOffset for the selected definition.
      additionalProperties: false
    OperationDefinitionView:
      type: object
      required:
      - doNotExpandPaths
      properties:
        doNotExpandPaths:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            maxLength: 2048
            pattern: '^(?:/(?:[^~]|~[01])*)?$'
          description: Request-root JSON pointers to declared fields or positional items whose children
            are omitted from presentation. Empty pointer selects the root. Generic collection indices
            and dictionary keys not declared in the matcher are rejected. No wildcards. Does not change
            validation, wireFormat, request bytes or definition digest. Omission or an empty list expands normally.
      additionalProperties: false
    OperationInputDescriptor:
      type: object
      required:
      - kind
      - wireFormat
      - constraintsJson
      - definitionPath
      - definitionBlueId
      properties:
        kind:
          type: string
          enum:
          - scalar
          - object
          - list
          - dictionary
          - reference
          - unrestricted
        wireFormat:
          type: string
          enum:
          - scalar
          - typed_scalar
          - array
          - typed_list
          - object
          - typed_object
          - reference
          - unrestricted
          description: Canonical request representation. Typed scalar values preserve their type and value
            fields; typed lists preserve their type and items fields. Other native metadata remains part
            of the original value. Never infer a wrapper solely from kind or typeBlueId.
        valueEncoding:
          type: string
          enum:
          - safe_number_or_decimal_string
          description: Explicit native typed-Integer value encoding. A value inside the safe integer range
            may be a JSON number; a larger integer is represented as its exact decimal string. Preserve
            the native type envelope. Do not silently change request bytes during validation.
        primitive:
          type: string
          enum:
          - string
          - integer
          - number
          - boolean
        typeBlueId:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OperationInputField'
        item:
          $ref: '#/components/schemas/OperationInputDescriptor'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationInputDescriptor'
          description: Declared positional list element definitions, when present.
        key:
          $ref: '#/components/schemas/OperationInputDescriptor'
        value:
          $ref: '#/components/schemas/OperationInputDescriptor'
        fixedJson:
          type: string
          description: Exact native fixed value encoded as JSON text. Presence is significant, including
            null.
        enumJson:
          type: array
          items:
            type: string
          description: Exact native choices encoded as JSON text.
        constraintsJson:
          type: string
          description: Resolved native Blue constraints encoded as lossless JSON text. This is not JSON
            Schema.
        requestPath:
          type: string
          description: Absolute request-root RFC 6901 pointer for this concrete declared node. Empty selects the request root. Absent for generic item/key/value templates and their descendants. Presentation only; not a descriptorPath selector.
        definitionPath:
          type: string
        definitionBlueId:
          type: string
        description:
          type: string
        collapsed:
          type: boolean
          description: Children are intentionally omitted by definitionView. Metadata and canonical validation remain unchanged.
        partial:
          type: boolean
          description: Presentation is incomplete; canonical validation is independent and complete. Expand
            this path or follow the returned collection offset.
        fieldsOffset:
          type: integer
          minimum: 0
        nextFieldsOffset:
          type: integer
          minimum: 0
        itemsOffset:
          type: integer
          minimum: 0
        nextItemsOffset:
          type: integer
          minimum: 0
      additionalProperties: false
    OperationInputField:
      type: object
      required:
      - name
      - required
      - definition
      properties:
        name:
          type: string
        required:
          type: boolean
        definition:
          $ref: '#/components/schemas/OperationInputDescriptor'
      additionalProperties: false
    OperationInputDefinition:
      type: object
      required:
      - state
      - digest
      - runtime
      properties:
        state:
          type: string
          enum:
          - no_matcher
          - matcher
          - unresolved
          description: Canonical request declaration state. Missing matcher is distinct from an explicit
            empty matcher. No metadata or inferred hidden requirements are read.
        digest:
          type: string
          description: Versioned canonical declaration and runtime fingerprint. Presentation selectors,
            pagination, descriptions of resolved fields and presentation failures do not alter it.
        runtime:
          type: object
          additionalProperties: true
          description: Exact canonical execution selection used to resolve and validate this definition.
        descriptor:
          $ref: '#/components/schemas/OperationInputDescriptor'
        description:
          type: string
        presentationIssues:
          type: array
          items:
            $ref: '#/components/schemas/OperationPreparationIssue'
          description: Non-authoritative presentation diagnostics; never changes canonical input validity.
      additionalProperties: false
    OperationPreparationIssue:
      type: object
      required:
      - path
      - code
      - message
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    OperationPreparationValidation:
      type: object
      required:
