    put:
      tags:
      - Admin
      operationId: updateAdminNotifications
      summary: Set registration notification recipients
      description: Replace the recipient list using its current revision. Registration and verification
        messages are queued durably; historical inventory does not replay old notifications. Empty recipients
        disable future notifications.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      - $ref: '#/components/parameters/ConsoleClient'
      responses:
        '200':
          description: Current result.
          headers:
