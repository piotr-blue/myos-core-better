  /api/blue/v1/admin/users/{userId}/impersonations:
    post:
      tags:
      - Admin
      operationId: createImpersonation
      summary: Start an independent one-hour user session
      description: Creates an independently revocable opaque bearer session with the target user’s existing
        memberships and write permissions. It expires absolutely after one hour and cannot refresh or
        obtain administrator access. No browser cookie is changed. Store the token only in the launched
        tab; never log it. Reuse the same Idempotency-Key after an unknown outcome.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      - name: userId
        in: path
        required: true
        schema:
          type: string
        examples:
          executed-573:
            $ref: '#/components/examples/Executed573'
      - $ref: '#/components/parameters/AccountCommandId'
      - $ref: '#/components/parameters/ConsoleClient'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationSession'
              examples:
                executed-574:
                  $ref: '#/components/examples/Executed574'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /api/blue/v1/impersonation:
    get:
      tags:
      - Admin
      operationId: getImpersonation
      summary: Read the current impersonation session
      description: Authenticates the impersonated bearer session and returns its actor, target and absolute
        expiry. Ordinary sessions return 404. Discovery does not require a selected account.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      - $ref: '#/components/parameters/SelectedAccount'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationMetadata'
              examples:
                executed-575:
                  $ref: '#/components/examples/Executed575'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
    delete:
      tags:
      - Admin
      operationId: endImpersonation
      summary: End only the current impersonation session
      description: Revokes the supplied impersonation session using the matching base or selected session
        context. No cookie is cleared and other impersonation tabs remain active. Repeating the same revocation
        is safe. Already admitted operations may finish.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/ConsoleClient'
      responses:
        '200':
          description: Current result.
          headers:
