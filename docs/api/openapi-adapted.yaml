      - nextPageToken
      - paginationMode
    AdmissionCommon:
      type: object
      properties:
        admissionId:
          type: string
        status:
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
        problem:
          $ref: '#/components/schemas/AdmissionProblem'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        completionScope:
          enum:
          - REGISTRATION_STORED
          - TIMELINE_ENTRY_STORED
          - TIMELINE_STORED
          - CONTENT_STORED
          - RETENTION_REMOVED
          - CONTROL_APPLIED
          - REGISTRATION_UNLINKED
          - PACKAGE_ACTION_APPLIED
      required:
      - admissionId
      - status
      - createdAt
      - completedAt
      - completionScope
      description: Durable host receipt. Poll GET /admissions/{admissionId}; the HTTP Location header
        is independent of this JSON. SUCCEEDED proves only completionScope. FAILED is still HTTP 200 when
        fetched. Replay observes the same receipt. READ_SELECTED callers receive their own membership-generation
        receipt metadata with details null; retrieve native results through the independently authorized
        document and content routes. Error details are redacted for those callers.
      allOf:
      - if:
          properties:
            status:
              const: FAILED
          required:
          - status
        then:
          required:
          - problem
          properties:
            details:
              type: 'null'
            completedAt:
              type: string
              format: date-time
        else:
          not:
            required:
            - problem
      - if:
          properties:
            status:
              const: PENDING
          required:
          - status
        then:
          properties:
            details:
              type: 'null'
            completedAt:
              type: 'null'
      - if:
          properties:
            status:
              const: SUCCEEDED
          required:
          - status
        then:
          properties:
            details:
              type:
              - object
              - 'null'
            completedAt:
              type: string
              format: date-time
    DocumentAdmissionDetails:
      type: object
      properties:
