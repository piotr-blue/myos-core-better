openapi: 3.1.0
info:
  title: MyOS Core API
  version: 0.4.0
  description: Account-independent human sessions select an Account per request with X-MyOS-Account. Session
    requests pin X-MyOS-Session-Context from /me or the selected /account discovery response. Account-bound
    API keys use the current membership role and generation. Ordinary authenticated GETs read one private
    PostgreSQL security and resource snapshot without activating a workspace. READ_SELECTED responses
    contain only proven native representation coverage. A new resource may return 404 until projection
    catches up; unavailable security or data projection fails closed. Existing test stores require a clean
    reset. There is no old account/session format fallback.
security:
- bearerAuth: []
- sessionCookie: []
tags:
- name: Admin
  description: Allowlisted platform administration and independent impersonated sessions.
- name: Agent Events
  description: Connection-owned MCP webhook subscriptions.
- name: Documents
  description: Register documents, invoke operations, and inspect state, history, and processing.
- name: Timelines
  description: Inspect native timelines, entries, and provider guarantees.
- name: Admissions
  description: 'Track 12 host receipt kinds: DOCUMENT (registration), OPERATION and TIMELINE_ENTRY (stored
    input), PAUSE/RESUME/RETRY (control), REMOVE (unlink), TIMELINE, CONTENT (both POST and PUT), CONTENT_REMOVE
    (retention), PACKAGE_INSTALL/PACKAGE_REMOVE. Each schema has typed details and completionScope. GET
    returns 200 even when status is FAILED; problem is present only for FAILED.'
- name: Contents
  description: Read retained content, collections, and owned Blue references.
- name: Webhooks
  description: Configure subscriptions and inspect or retry deliveries.
- name: Events
  description: Read events and stream committed resource invalidations.
- name: API Keys
  description: Manage developer API keys.
- name: Packages and Types
  description: Manage verified packages and inspect installed types.
- name: Account
  description: Discover Users and account memberships; explicitly create accounts and manage profile,
    Users, invitations and the disabled Agent.
- name: System
  description: Read the public API contract and current runtime identity.
paths:
  /api/blue/v1/admin/session:
    get:
      tags:
      - Admin
      operationId: getAdminSession
      summary: Discover allowlisted platform administrator
      description: Requires a current ordinary shared-portal session for an explicitly allowlisted verified
        email. Impersonated sessions, API keys and agents cannot access this API. No selected account
        is needed.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                executed-559:
                  $ref: '#/components/examples/Executed559'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          description: Origin, CSRF or ownership access denied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem403'
              examples:
                executed-560:
                  $ref: '#/components/examples/Executed560'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /api/blue/v1/admin/users:
    get:
      tags:
      - Admin
      operationId: listAdminUsers
      summary: Search the platform user directory
      description: Namespace-scoped PostgreSQL directory. Email search is a literal case-insensitive substring
        and requires at least two characters when nonempty. Stable ordering includes the user ID; unknown
        verification dates remain null and sort last. Cognito inventory completeness and freshness are
        reported separately.
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      - name: email
        in: query
        schema:
          type: string
          maxLength: 254
        examples:
          executed-564:
            $ref: '#/components/examples/Executed564'
      - name: verified
        in: query
        description: Filter by verification status. Omit to include both verified and unverified users.
        schema:
          type: boolean
        examples:
          executed-565:
            $ref: '#/components/examples/Executed565'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - verifiedAt
          default: createdAt
        examples:
          executed-566:
            $ref: '#/components/examples/Executed566'
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        examples:
          executed-567:
            $ref: '#/components/examples/Executed567'
      - $ref: '#/components/parameters/Limit'
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        examples:
          executed-568:
            $ref: '#/components/examples/Executed568'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
              examples:
                executed-569:
                  $ref: '#/components/examples/Executed569'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          description: Request does not satisfy a synchronous domain constraint.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem422'
              examples:
                executed-570:
                  $ref: '#/components/examples/Executed570'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
