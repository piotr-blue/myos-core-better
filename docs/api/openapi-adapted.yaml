  /api/blue/v1/admin/notifications:
    get:
      tags:
      - Admin
      operationId: getAdminNotifications
      summary: Read registration notification recipients
      description: Read registration notification recipients
      parameters:
      - $ref: '#/components/parameters/SessionContext'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotifications'
              examples:
                executed-561:
                  $ref: '#/components/examples/Executed561'
        default:
