              schema:
                $ref: '#/components/schemas/AgentEventUnsubscribed'
              examples:
                executed-526:
                  $ref: '#/components/examples/Executed526'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /api/blue/v1/account/image:
    delete:
      tags:
      - Account
      operationId: deleteAccountImage
      summary: Remove account image
      description: Current Business Account Owner or Admin only. Personal accounts use the User avatar
        instead. Revision checked and idempotent; rechecks authority before publication. The image belongs
        to the selected Account, independently of User avatars. Cosmetic changes do not activate a Tenant.
        Upload accepts JPEG/PNG up to 5 MiB and produces PNG within 512 x 512.
      parameters:
      - $ref: '#/components/parameters/AccountCommandId'
      - $ref: '#/components/parameters/SessionContext'
      - $ref: '#/components/parameters/ConsoleClient'
      - $ref: '#/components/parameters/SelectedAccount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountImage'
            examples:
              executed-511:
                $ref: '#/components/examples/Executed511'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DeleteAccountImage'
            examples:
              executed-512:
                $ref: '#/components/examples/Executed511'
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedAccountProfile'
              examples:
                executed-509:
                  $ref: '#/components/examples/Executed509'
            application/yaml:
              schema:
                $ref: '#/components/schemas/UpdatedAccountProfile'
              examples:
                executed-510:
                  $ref: '#/components/examples/Executed509'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          description: Origin, CSRF or ownership access denied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem403'
              examples:
                executed-508:
                  $ref: '#/components/examples/Executed508'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '415':
          $ref: '#/components/responses/Problem415'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
    put:
      tags:
      - Account
      operationId: putAccountImage
      summary: Replace account image
      description: Current Business Account Owner or Admin only. Personal accounts use the User avatar
        instead. Revision checked and idempotent; rechecks authority before publication. The image belongs
        to the selected Account, independently of User avatars. Cosmetic changes do not activate a Tenant.
        Upload accepts JPEG/PNG up to 5 MiB and produces PNG within 512 x 512.
      parameters:
      - $ref: '#/components/parameters/AccountCommandId'
      - $ref: '#/components/parameters/SessionContext'
      - $ref: '#/components/parameters/ConsoleClient'
      - $ref: '#/components/parameters/SelectedAccount'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PutAccountImage'
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Current result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedAccountProfile'
              examples:
                executed-504:
                  $ref: '#/components/examples/Executed504'
            application/yaml:
              schema:
                $ref: '#/components/schemas/UpdatedAccountProfile'
              examples:
                executed-505:
                  $ref: '#/components/examples/Executed504'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '415':
          $ref: '#/components/responses/Problem415'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /api/blue/v1/accounts/{accountId}/image/{version}:
    get:
      tags:
      - Account
      operationId: getAccountImage
      summary: Read a versioned Account image
      description: Authenticated callers in the same namespace can read the active Account image without
        selecting that Account, consistent with account discovery. Replaced and deleted versions return
        404; authenticate before conditional-cache evaluation.
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
        examples:
          executed-506:
            $ref: '#/components/examples/Executed506'
      - in: path
        name: version
        required: true
        schema:
          type: string
        examples:
          executed-507:
            $ref: '#/components/examples/Executed507'
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          description: Normalized Account image.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Private image caching.
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Authenticated avatar version has not changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
