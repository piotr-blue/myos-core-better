    ImportTimeline:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
        timelineId:
          type: string
        readerKeyId:
          type: string
          description: An existing reader-key identifier owned by this account. Mutually exclusive with
            readerPublicKey.
        readerPublicKey:
          type: string
          description: The exact public reader key declared by a party. Must resolve to a live private
            credential already owned by this account; this does not create a key or grant access.
        name:
          type: string
      required:
      - endpoint
      - timelineId
      anyOf:
      - required:
        - readerKeyId
      - required:
        - readerPublicKey
      not:
        required:
        - readerKeyId
        - readerPublicKey
      additionalProperties: false
    ImportedTimeline:
      type: object
      properties:
        timelineId:
          type: string
        name:
          type: string
        endpoint:
          type: string
          format: uri
        readerKeyId:
          type: string
        owned:
          type: boolean
        status:
          enum:
          - PENDING
          - AVAILABLE
          - UNAVAILABLE
          - RETRY_REQUIRED
        createdAt:
          type: string
          format: date-time
        lastChangedAt:
          type: string
          format: date-time
        lastFetchedAt:
          type: string
          format: date-time
        completeBefore:
          type: integer
        head:
          type:
          - string
          - 'null'
        issue:
          type: object
          properties:
            code:
              type: string
            availability:
              type: boolean
            category:
              enum:
              - AVAILABILITY
              - INVALID_EVIDENCE
            timeline:
              type: string
            endpoint:
              type: string
            message:
              type: string
            attempts:
              type: integer
            diagnostic:
              description: Additional native validation diagnostics, when available.
          required:
          - code
          - availability
          - category
          - timeline
          - endpoint
          - message
          - attempts
          additionalProperties: false
      required:
      - timelineId
      - name
      - endpoint
      - owned
      - status
      additionalProperties: false
      description: Provider-backed timeline metadata and current import availability, including the account's
        own timelines (owned=true) and read imports (owned=false). timelineId is the canonical native
        timeline identity and matches operations[].routes[].timeline. This shape has no blueId field;
        the presence of endpoint does not imply read-only access. Fetch exact timeline content through
        its timelineId reference when needed.
    TimelineAccess:
      type: object
      properties:
        id:
          type: string
        allowedKeys:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
        allowedTimelines:
          type: array
          items:
            type: string
        document:
          type: object
          description: Native Blue document or signed provider evidence; its domain fields are preserved.
        current:
          type: object
          description: Native Blue document or signed provider evidence; its domain fields are preserved.
      required:
      - id
      - allowedKeys
      - allowedTimelines
      - document
      - current
      additionalProperties: false
    TimelineAccessList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineAccess'
      required:
      - items
      additionalProperties: false
    UpdateTimelineAccess:
      type: object
      properties:
        executionSelection:
          $ref: '#/components/schemas/RuntimeIdentities'
          description: Optional complete advertised execution selection for the owner's access follower.
            Omission preserves the account default. Existing followers cannot change selection.
            The provider grant commits before a new follower is imported; a later import failure does not
            roll back the grant. Retry the identical request and key to recover that grant without a duplicate
            update. A conflicting already-bound follower is not replaced by retrying.
        accessId:
          type: string
        allowedKeys:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
      required:
      - allowedKeys
      additionalProperties: false
    ImportTimelineAccess:
      type: object
      properties:
        executionSelection:
          $ref: '#/components/schemas/RuntimeIdentities'
          description: Optional complete advertised execution selection for this access follower.
            Omission preserves the account default. Repeating the same import recovers the same registration;
            an existing follower bound to another selection is rejected and never replaced. Importing
            public access evidence does not change the provider grant.
        endpoint:
          type: string
          format: uri
        accessId:
          type: string
      required:
      - endpoint
      - accessId
      additionalProperties: false
    ImportedAccessDocument:
      type: object
      properties:
        sessionId:
          type: string
        id:
          type: string
        name:
          type: string
        documentId:
          type: string
      required:
      - sessionId
      - id
      - name
      - documentId
      additionalProperties: false
    BootstrapDocument:
      type: object
      properties:
        executionSelection:
          $ref: '#/components/schemas/RuntimeIdentities'
          description: Optional complete exact selection returned by info.registrationExecutionSelections.
            Selects only this new registration; omission preserves the account default. All bootstrap
            participants must acknowledge the same selection before timeline resources are created. Existing
            source or version registrations with incompatible execution are rejected.
        packages:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Exact package BlueIds from the verified catalogue. Installs their dependency closure
            and uses these definitions to resolve source type names. Version aliases are not accepted.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: \S
        document:
          $ref: '#/components/schemas/DocumentInput'
        inputMode:
          $ref: '#/components/schemas/InputMode'
        participantMappings:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BootstrapParticipantMapping'
          - type: 'null'
          description: Complete mappings for unbound participant channels. Each selects an existing accountId
            and optionally a human representativeId or singleton agentId. The initiating account must
            be a participant. Typed Parties in /parties and Activation can declare their own accounts;
            custom current-document Party positions require partyPath. Actual bootstrap adds each Party
            account's own singleton when its saved inclusion setting is enabled, preserving explicit human
            representatives. Accepted replay does not consult changed settings.
      required:
      - document
      additionalProperties: false
    BootstrapParticipantMapping:
      type: object
      properties:
        channelName:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
          not:
            enum:
            - embedded
            - initialized
            - terminated
        accountId:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
          description: Resolves the account owned by this verified or invited identity. Mutually exclusive
            with accountId. A personal account is created when the identity has no owned account; unknown
            recipients are invited to sign up and verify this email. Resolution is pinned for retries.
        representativeId:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable active human User ID in the selected account. Creates a human writer binding;
            selected-read access additionally requires the qualified frozen human-representation profile
            and native approval/access evidence. Mutually exclusive with agentId.
        agentId:
          type: string
          minLength: 1
          maxLength: 100
          description: The selected account's own singleton Agent ID. Creates a distinct Agent writer,
            never human or account-principal authority. Mutually exclusive with representativeId. Explicit
            assignment is independent of the automatic inclusion setting.
        partyPath:
          type: string
          maxLength: 2048
          pattern: ^(?:/.*)?$
          description: Native path to a typed Party in the current document; the empty string selects
            a root Party. Required for custom Party locations. Root /parties and Activation rosters bind
            automatically. Independently processed children and executable recipes are outside this scope.
      required:
      - channelName
      anyOf:
      - required:
        - accountId
      - required:
        - email
      additionalProperties: false
      not:
        anyOf:
        - required:
          - representativeId
          - agentId
        - required:
          - accountId
          - email
    RuntimeRecovery:
      type: object
      properties:
        status:
          const: recovery_requested
      required:
      - status
      additionalProperties: false
    BlueReference:
      type: object
      properties:
        blueId:
          type: string
          minLength: 1
          pattern: \S
      required:
      - blueId
      additionalProperties: false
    BlueValue:
      description: A native Blue display value; domain fields remain open. Arbitrary-size integers are
        preserved. Unsupported native decimal precision is rejected rather than silently rounded.
    ExactText:
      type: object
      properties:
        mode:
          const: exact
        format:
          enum:
          - json
          - yaml
          default: json
        text:
          type: string
      required:
      - mode
      - text
      additionalProperties: false
    CyclicEvidence:
      type: object
      properties:
        proof:
          type:
          - string
          - object
          description: Native proof encoding is preserved, whether serialized text or an object.
        body:
          type: string
      required:
      - proof
      - body
      description: Native owning-set proof and body. Retain at its exact BlueId; do not discard proof
        when exporting a cyclic value.
      additionalProperties: false
    NativeExactContent:
      oneOf:
      - $ref: '#/components/schemas/ExactText'
      - $ref: '#/components/schemas/CyclicEvidence'
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: ^[A-Z0-9_]+$
        instance:
          type: string
        requestId:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - code
      - instance
      - requestId
      description: HTTP errors always use application/problem+json. HEAD errors have no body.
    ProcessingReason:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Retained code-specific facts, including resource IDs, gas requirements and the
            gasEvaluation used for an explicit retry.
        phase:
          type: string
      required:
      - code
      - message
      description: One explanation for waiting, paused or failed processing. Native diagnostic facts are
        preserved in details.
    Processing:
      type: object
      properties:
        state:
          enum:
          - READY
          - PROCESSING
          - WAITING
          - PAUSED
          - ERROR
          - HOST_INCOMPLETE
        nativeState:
          enum:
          - READY
          - PROCESSING
          - WAITING
          - ERROR
          - HOST_INCOMPLETE
        checkedBoundary:
          type: integer
        reason:
          anyOf:
          - $ref: '#/components/schemas/ProcessingReason'
          - type: 'null'
        retryable:
          type: boolean
      required:
      - state
      - nativeState
      - checkedBoundary
      - reason
      - retryable
      description: Current processing state. checkedBoundary is a timestamp boundary in microseconds;
        it does not independently prove completion of a business process.
      additionalProperties: false
    HistoryPosition:
      type: object
      additionalProperties: false
      properties:
        positionRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact reference to the retained History Position; not an epoch number or a reference
            to the latest document.
        predecessorRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Exact predecessor History Position; null only when the position has no predecessor.
        kind:
          type: string
          description: Discriminator selecting the meaning and schema of this record; distinct from an
            event notification category.
          enum:
          - INITIALIZE
          - PROCESS
          - APPLY
          - COMPLETE
        epoch:
          type: integer
          description: Stable epoch retained at this History Position. Several completed non-stable transitions
            may retain the same epoch; only stable=true denotes a stable publication.
          minimum: 0
        stable:
          type: boolean
          description: Whether this retained transition is a stable publication. Completed non-stable
            transitions remain in history.
        documentRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact document state recorded at this history position. stable indicates whether
            it is an externally published stable snapshot.
        receiptRef:
          $ref: '#/components/schemas/BlueReference'
          description: Exact reference to the receipt retained for this transition.
      required:
      - documentRef
      - epoch
      - kind
      - positionRef
      - predecessorRef
      - receiptRef
      - stable
      description: One retained native transition, including unstable transitions. COMPLETE remains a
        native kind and can reuse a receipt without additional gas; it is not renamed PROCESS.
    Document:
      type: object
      properties:
        typeBlueId:
          type:
          - string
          - 'null'
          description: Declared type of the last stable version, when available.
        typePath:
          type:
          - string
          - 'null'
          description: Root-to-type BlueIds separated and terminated by slash; metadata, not document
            content.
        typeStatus:
          type: string
          enum:
          - INDEXED
          - UNTYPED
          - PENDING
          - UNAVAILABLE
          description: PENDING precedes stable metadata; UNAVAILABLE means exact ancestry could not be
            resolved.
        sessionId:
          type: string
        instanceId:
          type: string
        documentId:
          type:
          - string
          - 'null'
        name:
          type: string
        description:
          type:
          - string
          - 'null'
          description: Native description from the last stable publication, never generated overview.
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        lastStable:
          anyOf:
          - $ref: '#/components/schemas/LastStable'
          - type: 'null'
        control:
          type: string
          enum:
          - RUNNING
          - PAUSED
          description: Immediate native control state. Core does not produce PAUSING.
        lifecycle:
          type: string
          enum:
          - NOT_INITIALIZED
          - ACTIVE
          - TERMINATED
          description: NOT_INITIALIZED means no initial stable publication is retained.
        processing:
          $ref: '#/components/schemas/Processing'
        lastChangedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Observed activity time when available; null when no dated fact is retained.
        canUnlink:
          type: boolean
          description: Whether this document has a registration that can be unlinked.
      required:
      - sessionId
      - instanceId
      - documentId
      - name
      - createdAt
      - lastStable
      - control
      - lifecycle
      - processing
      - canUnlink
      - lastChangedAt
      description: sessionId identifies a registration, instanceId the running document instance, and
        documentId its lineage. lastStable references identify a single stable version. This resource
        contains metadata; retrieve content separately.
    DocumentProcessing:
      $ref: '#/components/schemas/Processing'
    NativeProcessingReason:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        documents:
          type: array
          items:
            type: string
        required:
          type: array
          items:
            type: string
          description: Unresolved Blue IDs blocking the latest attempt when code is NEEDS_RESOURCES. Includes
            failed dependencies only. Resolving them may reveal further requirements.
      description: Native observed reason. Other native diagnostic facts may be present.
    EvidenceTarget:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: Opaque handle of this document registration in the caller’s scope. It is not a
            document lineage or an exact version BlueId.
        documentId:
          type: string
          description: Identity of the document lineage, shared by its versions; distinct from the registration
            handle and exact content BlueId.
        epoch:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Stable epoch selected by the target, or null when the target is not a stable publication.
        positionRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Actual retained History Position selected by this target, never a fabricated latest-state
            reference.
        entryRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Original input entry selected by this target, or null when the target is not entry-specific.
      required:
      - documentId
      - entryRef
      - epoch
      - positionRef
      - sessionId
    EpochCause:
      type: object
      additionalProperties: false
      description: 'Cause of a stable publication. A cause identifies why this result exists; it is not
        a platform-notification type.


        | kind | Meaning |

        | --- | --- |

        | `INITIALIZATION` | The first stable state was established; entryRef is null. |

        | `TIMELINE_ENTRY` | Processing an original Timeline Entry produced this publication. |

        | `EMBEDDED_REVISION_APPLICATION` | A managed source revision was applied to this document. |

        | `CATCH_UP_COMPLETED` | Required history application reached its fixed boundary and a stable
        result was published. |

        | `EVENT_ONLY` | An execution emitted events without changing the exact document state. |'
      properties:
        kind:
          type: string
          enum:
          - INITIALIZATION
          - TIMELINE_ENTRY
          - EMBEDDED_REVISION_APPLICATION
          - CATCH_UP_COMPLETED
          - EVENT_ONLY
          description: Reason this stable revision was published.
        entryRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
          description: Actual original input when retained for this publication; null for initialization
            or when no input correlation exists.
      required:
      - entryRef
      - kind
    ExactEvidenceRecord:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Discriminator selecting the meaning and schema of this record; distinct from an
            event notification category.
          enum:
          - CONTENT
          - HISTORY_POSITION
          - PROCESSING_RECEIPT
          - RECEIVING
        ref:
          $ref: '#/components/schemas/BlueReference'
          description: Exact Blue reference identifying this retained value.
        value:
          $ref: '#/components/schemas/ContentValue'
          description: Exact retained Blue value, decoded without a native transport or cyclic owning-set
            proof.
      required:
      - kind
      - ref
      description: Retained exact material selected for this target. References identify original content;
        this page does not claim a closed or independently verified proof set.
    DocumentEvidence:
      type: object
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/EvidenceTarget'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExactEvidenceRecord'
        nextPageToken:
          type:
          - string
          - 'null'
      required:
      - target
      - items
      - nextPageToken
      description: Selected retained document, history-position, processing-receipt and immediate receiving
        material. The target and retained history boundary are fixed for this traversal. This subset does
        not advertise evidenceSetId, completeness, portability, assurance or host verification. Raw host
        diagnostics remain available from their existing endpoints.
    NativeInputObservation:
      type: object
      properties:
        sessionId:
          type: string
        entryBlueId:
          type: string
        assessment:
          type:
          - object
          - 'null'
        localHistory:
          type: array
          items:
            $ref: '#/components/schemas/NativeHistoryEventPayload'
        disposition:
          type:
          - object
          - 'null'
        processing:
          $ref: '#/components/schemas/NativeProcessing'
      required:
      - sessionId
      - entryBlueId
      - assessment
      - localHistory
      - disposition
      - processing
      additionalProperties: false
      description: Original Core input observation. Local assessment and requested-entry disposition remain
        separate, with retained native history rows. A missing disposition is unknown, not NO_MATCH or
        COMPLETE.
    Requirements:
      $ref: '#/components/schemas/NativeProcessing'
    TimelineResource:
      anyOf:
      - $ref: '#/components/schemas/Timeline'
      - $ref: '#/components/schemas/ImportedTimeline'
      description: Host-managed owned timeline (Timeline) or provider-backed timeline (ImportedTimeline).
        Provider-backed timelines include both owned=true and read-only owned=false rows; determine ownership
        from owned, not from the presence of endpoint or absence of blueId.
    Timeline:
      type: object
      properties:
        timelineId:
          type: string
        blueId:
          type: string
        name:
          type: string
        actors:
          type: array
          items:
            type: string
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        lastChangedAt:
          type:
          - string
          - 'null'
          format: date-time
        completeBefore:
          type: integer
      required:
      - timelineId
      - blueId
      - name
      - actors
      - createdAt
      - lastChangedAt
      - completeBefore
      description: Host-managed owned timeline metadata. timelineId is the host management identity; blueId
        is the distinct native timeline identity and matches operations[].routes[].timeline. Provider-backed
        owned timelines use ImportedTimeline instead. completeBefore is the established native frontier.
    TimelineEntriesPage:
      anyOf:
      - $ref: '#/components/schemas/ProviderRange'
      - $ref: '#/components/schemas/ImportedTimelineEntriesPage'
      - $ref: '#/components/schemas/ProjectedTimelineEntriesPage'
    ProjectedTimelineEntriesPage:
      type: object
      properties:
        timelineRef:
          $ref: '#/components/schemas/BlueReference'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        nextPageToken:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        paginationMode:
          const: PROJECTED_RETAINED_ENTRIES
      required:
      - timelineRef
      - items
      - nextPageToken
      - hasMore
      - paginationMode
      additionalProperties: false
      description: Retained original entries in native order, pinned to the projection sequence selected
        on the first page. Later imports of older timestamps do not enter that pagination. beforeUs is
        an exclusive timestamp filter; afterEntryBlueId must be a retained entry of the selected timeline
        and range. Neither guaranteeRef nor attestationRef is generated; this page does not prove completeness.
    ImportedTimelineEntriesPage:
      type: object
      properties:
        timelineRef:
          $ref: '#/components/schemas/BlueReference'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        nextPageToken:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        paginationMode:
          const: RETAINED_IMPORTED_ENTRIES
      required:
      - timelineRef
      - items
      - nextPageToken
      - hasMore
      - paginationMode
      additionalProperties: false
      description: Retained imported entries and their original values in native order. Import polling
        may add entries between pages. This page is not a signed completeness proof.
    ProviderRange:
      type: object
      properties:
        timelineRef:
          $ref: '#/components/schemas/BlueReference'
        beforeUs:
          type: integer
          minimum: 0
          maximum: 9007199254740992
        afterEntryRef:
          anyOf:
          - $ref: '#/components/schemas/BlueReference'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        guaranteeRef:
          $ref: '#/components/schemas/BlueReference'
        attestationRef:
          $ref: '#/components/schemas/BlueReference'
        nextPageToken:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        paginationMode:
          const: BOUNDED_PROVIDER_RANGE
      required:
      - timelineRef
      - beforeUs
      - afterEntryRef
      - items
      - guaranteeRef
      - attestationRef
      - nextPageToken
      - hasMore
      - paginationMode
      description: Existing signed provider range; upper completeness boundary is pinned by continuation.
        Requests beyond the established provider frontier fail without advancing it.
    TimelineEntry:
      type: object
      properties:
        blueId:
          type: string
        entry:
          type: object
          description: Original retained entry value decoded from its exact transport. Native signed fields
            are preserved without adding initialDocument; cyclic entries retain the original owning-set
            proof/body envelope.
      required:
      - blueId
      - entry
      additionalProperties: false
      description: Entry identity and original retained entry. The entry is not reconstructed from index
        metadata or renamed reference fields.
    ContentMetadata:
      type: object
      properties:
        blueId:
          type: string
        name:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        lastChangedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - blueId
      description: Explicit retention metadata; createdAt is not a guaranteed immutable first-upload time.
    GasChangedEvent:
      allOf:
      - $ref: '#/components/schemas/EventCommon'
      - type: object
        properties:
          type:
            const: ACCOUNT_GAS_CHANGED
          ref:
            type: object
            properties:
              accountId:
                type: string
            required:
            - accountId
          object:
            type: object
            properties:
              credited:
                $ref: '#/components/schemas/GasAmount'
              spent:
                $ref: '#/components/schemas/GasAmount'
              reserved:
                $ref: '#/components/schemas/GasAmount'
              available:
                $ref: '#/components/schemas/GasAmount'
              generation:
                $ref: '#/components/schemas/GasAmount'
              balance:
                $ref: '#/components/schemas/GasAmount'
              before:
                $ref: '#/components/schemas/GasEventBalance'
              causes:
                type: array
                items:
                  $ref: '#/components/schemas/GasEventCause'
            description: Committed after-state, before-state and causes from the same publication. Balance
              includes reserved gas; available excludes it.
            required:
            - credited
            - spent
            - reserved
            - available
            - generation
            - balance
            - before
            - causes
        required:
        - type
        - ref
        - object
    GasEventBalance:
      type: object
      properties:
        credited:
          $ref: '#/components/schemas/GasAmount'
        spent:
          $ref: '#/components/schemas/GasAmount'
        reserved:
          $ref: '#/components/schemas/GasAmount'
        available:
          $ref: '#/components/schemas/GasAmount'
        balance:
          $ref: '#/components/schemas/GasAmount'
        generation:
          $ref: '#/components/schemas/GasAmount'
      required:
      - credited
      - spent
      - reserved
      - available
      - balance
      - generation
    GasEventCause:
      type: object
      properties:
        kind:
          enum:
          - CREDIT
          - RESERVED
          - SETTLED
          - RELEASED
        id:
          type: string
        units:
          $ref: '#/components/schemas/GasAmount'
        instance:
          type: string
        evaluation:
          type: string
        phase:
          type: string
        debit:
          $ref: '#/components/schemas/GasAmount'
        usage:
          $ref: '#/components/schemas/GasAmount'
        returned:
          $ref: '#/components/schemas/GasAmount'
        disposition:
          type: string
        issuer:
          type: string
        evidence:
          type: string
      required:
      - kind
      - id
      - units
    EventCategory:
      enum:
      - DOCUMENT_CREATED
      - DOCUMENT_REMOVED
      - DOCUMENT_EPOCH_ADVANCED
      - DOCUMENT_PROCESSING_HISTORY_APPENDED
      - DOCUMENT_PROCESSING_ERROR
      - DOCUMENT_PROCESSING_PAUSED
      - DOCUMENT_PROCESSING_RESUMED
      - TIMELINE_CREATED
      - TIMELINE_ENTRY_CREATED
      - ADMISSION_STATUS_CHANGED
      - CONTENT_CREATED
      - ACCOUNT_GAS_CHANGED
    Event:
      oneOf:
      - $ref: '#/components/schemas/AdmissionStatusEvent'
      - $ref: '#/components/schemas/DocumentCreatedEvent'
      - $ref: '#/components/schemas/DocumentRemovedEvent'
      - $ref: '#/components/schemas/DocumentPausedEvent'
      - $ref: '#/components/schemas/DocumentResumedEvent'
      - $ref: '#/components/schemas/DocumentHistoryEvent'
      - $ref: '#/components/schemas/DocumentEpochEvent'
      - $ref: '#/components/schemas/DocumentErrorEvent'
      - $ref: '#/components/schemas/TimelineCreatedEvent'
      - $ref: '#/components/schemas/TimelineEntryCreatedEvent'
      - $ref: '#/components/schemas/ContentCreatedEvent'
      - $ref: '#/components/schemas/GasChangedEvent'
      discriminator:
        propertyName: type
        mapping:
          ADMISSION_STATUS_CHANGED: '#/components/schemas/AdmissionStatusEvent'
          DOCUMENT_CREATED: '#/components/schemas/DocumentCreatedEvent'
          DOCUMENT_REMOVED: '#/components/schemas/DocumentRemovedEvent'
          DOCUMENT_PROCESSING_PAUSED: '#/components/schemas/DocumentPausedEvent'
          DOCUMENT_PROCESSING_RESUMED: '#/components/schemas/DocumentResumedEvent'
          DOCUMENT_PROCESSING_HISTORY_APPENDED: '#/components/schemas/DocumentHistoryEvent'
          DOCUMENT_EPOCH_ADVANCED: '#/components/schemas/DocumentEpochEvent'
          DOCUMENT_PROCESSING_ERROR: '#/components/schemas/DocumentErrorEvent'
          TIMELINE_CREATED: '#/components/schemas/TimelineCreatedEvent'
          TIMELINE_ENTRY_CREATED: '#/components/schemas/TimelineEntryCreatedEvent'
          CONTENT_CREATED: '#/components/schemas/ContentCreatedEvent'
          ACCOUNT_GAS_CHANGED: '#/components/schemas/GasChangedEvent'
      description: The 12 event categories used by notifications and webhook callbacks. Event payloads
        preserve the values recorded at publication time and may differ from current resource representations.
        Session filters match ref.sessionId directly. Historical result fields, including id and location,
        remain available.
    WebhookSelector:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EventCategory'
      required:
      - type
      additionalProperties: false
    WebhookFilters:
      type: object
      properties:
        sessionIds:
          type: array
          items:
            type: string
          maxItems: 1000
      additionalProperties: false
    WebhookWrite:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: Public HTTPS on port 443; redirects and private destinations are rejected.
        status:
          enum:
          - ACTIVE
          - INACTIVE
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSelector'
          maxItems: 1000
        filters:
          $ref: '#/components/schemas/WebhookFilters'
      description: 'POST partial update: omitted fields preserve state; filters:{} or filters:{sessionIds:[]}
        reset session filtering; filters:[] is invalid. Empty events selects all categories. Session filters
        compare literal event.ref.sessionId, without causal graph expansion.'
      additionalProperties: false
    WebhookCreate:
      allOf:
      - $ref: '#/components/schemas/WebhookWrite'
      - required:
        - url
    Webhook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        status:
          enum:
          - ACTIVE
          - INACTIVE
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSelector'
        filters:
          $ref: '#/components/schemas/WebhookFilters'
        callbackProtocol:
          const: native-v1
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - url
      - status
      - events
      - filters
      - callbackProtocol
      description: Public subscription fields. New hooks start at the current event sequence with no backfill.
        Deleted configurations return 404; retained delivery reads remain available.
      additionalProperties: false
    Delivery:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        webhookId:
          type: string
        status:
          enum:
          - PENDING
          - SENDING
          - RETRYING
          - SUCCEEDED
          - FAILED
          - CANCELED
        attempts:
          type: integer
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        responseStatus:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - id
      - eventId
      - webhookId
      - status
      description: Retained webhookId/eventId delivery, available after staging. id identifies the delivery
        separately from eventId. Six delivery states describe transport, not receiver business completion.
        Reads survive configuration tombstones.
      additionalProperties: false
    DeliveryAttempt:
      type: object
      properties:
        deliveryId:
          type: string
        number:
          type: integer
        status:
          enum:
          - STARTED
          - UNKNOWN
          - SUCCEEDED
          - FAILED
          - CANCELED
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        responseStatus:
          type:
          - integer
          - 'null'
        id:
          type: string
        error:
          type:
          - string
          - 'null'
      description: Retained native attempt facts. Unknown outcomes after a crash are retained, not inferred
        successful.
      required:
      - id
      - deliveryId
      - number
      - status
      additionalProperties: false
    WebhookHealth:
      type: object
      properties:
        webhookId:
          type: string
        deliveriesByStatus:
          type: object
          additionalProperties:
            type: integer
        queued:
          type: integer
        attempts:
          type: integer
        measurementScope:
          const: RETAINED_DELIVERIES
      required:
      - webhookId
      - deliveriesByStatus
      - queued
      - attempts
      - measurementScope
