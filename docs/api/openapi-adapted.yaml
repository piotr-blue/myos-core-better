  /api/blue/v1/documents/bootstrap:
    post:
      tags:
      - Documents
      operationId: bootstrapDocument
      summary: Bootstrap a shared document
      description: Accepts a durable bootstrap Admission with exactly one accountId or email per mapping.
        Email selects the account owned by that identity. After pure document preflight, a personal account
        is created if the identity owns none; unknown recipients receive a signup invitation. Resolution
        is retained for retries even if ownership later changes. Optional representativeId identifies
        an active human User; this binding alone grants no selected-read access. Optional agentId binds
        the selected account's singleton as a separate Agent writer. Typed Parties use their accounts'
        saved inclusion setting to add their own singleton during actual bootstrap only. Explicit human
        representatives remain. Custom Party positions require partyPath; children and other operations
        do not resolve inclusion defaults. The settings revision is rechecked before acceptance, and accepted
        replay retains the exact roster. Participant channels must be unbound; existing timeline or actor
        bindings and external provider selection are rejected before resources are created. Canonical
        acceptance retains an immutable plan before provider resources or participant workspaces change.
        Accepted work continues within that plan after the initiating credential is revoked; native party
        approvals and subsequent business operations still require their own authority. Preparation runs
        on up to four accounts concurrently per initiator and retries temporary failures. SUCCEEDED means
        all target registrations are stored, not that document processing has completed. Admission details
        are null while pending or failed and contain only sessionId on success. Await the Admission through
        Location, then wait for document initialization. An Activation clause may declare parties, representatives
        and read-only accounts directly; supplied mappings must agree with those exact account IDs. Otherwise,
        mappings are required for every unbound participant channel. The optional packages array selects
        exact verified package BlueIds and complete dependencies before source type names are resolved.
        At most 64 participant channels may be selected, including generated representatives. Reader groups
        retain their current owned public-key requirements. Initial messages and business email delivery
        are unavailable. Only the 202 Admission contract is supported.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ConsoleClient'
      - $ref: '#/components/parameters/SelectedAccount'
      - $ref: '#/components/parameters/SessionContext'
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '406':
          $ref: '#/components/responses/Problem406'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '415':
          $ref: '#/components/responses/Problem415'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
        '202':
          description: Bootstrap admitted; poll the receipt for durable registration and the target session
            identifier.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: URL for reading the Admission status.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapAdmission'
              examples:
                executed-289:
