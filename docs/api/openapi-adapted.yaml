      properties:
        status:
          type: string
          enum:
          - missing_input
          - valid
          - invalid
          - unresolved
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OperationPreparationIssue'
      additionalProperties: false
    OperationPreparationPreconditions:
      type: object
      required:
      - requireExactDocumentVersion
      properties:
        requireExactDocumentVersion:
          type: boolean
          enum:
          - true
      additionalProperties: false
    PreparedDocumentOperation:
      type: object
      required:
      - accountId
      - sessionId
      - documentId
      - reviewedPublication
      - operationName
      - route
      - definition
      - validation
      - preconditions
      properties:
        accountId:
          type: string
        sessionId:
          type: string
        documentId:
          type:
          - string
          - 'null'
        reviewedPublication:
          $ref: '#/components/schemas/OperationReviewedPublication'
        operationName:
          type: string
        route:
          $ref: '#/components/schemas/OperationPreparationRoute'
        definition:
          $ref: '#/components/schemas/OperationInputDefinition'
        validation:
          $ref: '#/components/schemas/OperationPreparationValidation'
        requestJson:
          type: string
          description: Original user-supplied native request JSON; absent when no input was supplied.
        messageJson:
          type: string
          description: Exact native operation message JSON object for a separate confirmed submission.
        preconditions:
