    RemoveAdmission:
      allOf:
      - $ref: '#/components/schemas/AdmissionCommon'
      - type: object
        properties:
          kind:
            const: REMOVE
          completionScope:
            enum:
            - REGISTRATION_UNLINKED
            - CONTROL_APPLIED
            description: REGISTRATION_UNLINKED confirms removal of the registration. Earlier removal receipts
              retain CONTROL_APPLIED when they confirm a control change.
          details:
            anyOf:
            - $ref: '#/components/schemas/RemoveAdmissionDetails'
            - type: 'null'
        required:
        - kind
        - completionScope
        - details
      - if:
          properties:
            completionScope:
              const: REGISTRATION_UNLINKED
            status:
              const: SUCCEEDED
          required:
          - completionScope
          - status
        then:
          properties:
            details:
              required:
              - processingChanged
      - if:
          properties:
            completionScope:
              const: CONTROL_APPLIED
          required:
          - completionScope
        then:
          properties:
            details:
              not:
                type: object
                required:
                - processingChanged
      unevaluatedProperties: false
